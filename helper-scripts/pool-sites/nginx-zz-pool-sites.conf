# ============================================================
# 号池域名的静态落地页
#
# 为什么单独一个文件、而不是走 mailcow 的 site.*.custom 钩子：
#   那个 include 位于 mailcow 的 **server 块内部**（sites-default.conf.j2 末行），
#   只能放 location 级指令；而这里需要的是**独立 server 块**。
#   nginx.conf 有 http 级 `include /etc/nginx/conf.d/*.conf;`，
#   所以 conf.d 下的独立 .conf 会被正确加载为 server 块。
#
# 安全性：只新增 server 块，不改动 mailcow 自己的 server_name
# （mail.pony-it.com），也不涉及任何 MX / SPF / DKIM。
# 回滚：删除本文件 + `docker compose up -d --force-recreate --no-deps nginx-mailcow`。
# ============================================================

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name brightcrateglobal.com www.brightcrateglobal.com;

    ssl_certificate     /etc/ssl/mail/cert.pem;
    ssl_certificate_key /etc/ssl/mail/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /web-sites/brightcrateglobal.com;
    index index.html;

    # ACME HTTP-01 挑战通道。
    # mailcow 的 acme 容器把挑战文件写到 data/web/.well-known/acme-challenge
    # （容器内 /web/.well-known/acme-challenge）。
    # 本 server 块的 root 指向静态站，所以必须**显式**把这条路径指回 mailcow 的 webroot，
    # 否则 ACME 会报 "Confirmed A record ... but HTTP validation failed"（实测踩过）。
    location ^~ /.well-known/acme-challenge/ {
        root /web;
        allow all;
        default_type "text/plain";
    }

    location / { try_files $uri $uri/ /index.html; }
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }
}


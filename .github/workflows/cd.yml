name: CD

# 部署流水线
#   develop / master 分支合并 → 自动部署到 staging
#   main 分支合并             → 需人工审批 → 部署到 production
#   workflow_dispatch         → 手动触发，可选目标环境
#
# 分支说明：本地默认分支是 master，而 GitHub 目标仓库
# （github.com/lza6/mailcow-dockerized-Max）使用 main，两者都要覆盖。
# main 视为生产发布分支，master / develop 视为集成分支。
#
# 凭据说明：部署作业依赖 SSH 凭据 secrets（STAGING_SSH_KEY / PRODUCTION_SSH_KEY）。
# 未配置时由 gate 作业探测并**跳过**对应部署作业（带 ::warning:: 提示），
# 而不是让流水线以「必然失败」收场 —— 失败的绿灯比红灯更没人看。
on:
  push:
    branches: [master, develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "部署目标"
        required: true
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  # 同一环境不允许并发部署，避免互相覆盖
  group: cd-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # 部署前门禁：复用 CI 的质量与测试，未通过不允许部署
  # ============================================================
  gate:
    name: 部署前门禁
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      target: ${{ steps.decide.outputs.target }}
      staging: ${{ steps.creds.outputs.staging }}
      production: ${{ steps.creds.outputs.production }}
    steps:
      - uses: actions/checkout@v4

      - name: 决定部署目标
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target=production" >> "$GITHUB_OUTPUT"
          else
            echo "target=staging" >> "$GITHUB_OUTPUT"
          fi

      # 部署凭据探测：缺失时跳过对应环境的部署，避免产出「必然失败」的红灯
      - name: 检查部署凭据是否可用
        id: creds
        env:
          STAGING_KEY: ${{ secrets.STAGING_SSH_KEY }}
          PRODUCTION_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$STAGING_KEY" ]; then
            echo "staging=true" >> "$GITHUB_OUTPUT"
          else
            echo "staging=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 secrets.STAGING_SSH_KEY，已跳过 staging 部署。"
          fi
          if [ -n "$PRODUCTION_KEY" ]; then
            echo "production=true" >> "$GITHUB_OUTPUT"
          else
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "::warning::未配置 secrets.PRODUCTION_SSH_KEY，已跳过 production 部署。"
          fi

      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, intl, json
          coverage: none

      - name: PHP 语法检查
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            php -l "$f" >/dev/null 2>&1 || { echo "::error file=$f::语法错误"; fail=$((fail+1)); }
          done < <(find data/web -name '*.php' -not -path '*/vendor/*' -not -path '*/lib/*')
          [ "$fail" -eq 0 ]

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 语言包校验
        run: node .github/scripts/check-lang.cjs

  # ============================================================
  # 部署到 staging（develop 合并后自动执行）
  # ============================================================
  deploy-staging:
    name: 部署 staging
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.target == 'staging' && needs.gate.outputs.staging == 'true'
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        run: .github/scripts/setup-ssh.sh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}

      - name: 部署
        run: .github/scripts/deploy.sh
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_PATH }}
          ENVIRONMENT: staging

      - name: 健康检查
        run: .github/scripts/healthcheck.sh "${{ vars.STAGING_URL }}"

      - name: 失败时回滚
        if: failure()
        run: .github/scripts/rollback.sh
        env:
          DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
          DEPLOY_USER: ${{ secrets.STAGING_USER }}
          DEPLOY_PATH: ${{ secrets.STAGING_PATH }}
          ENVIRONMENT: staging

  # ============================================================
  # 部署到 production（main 合并后，需人工审批）
  # ============================================================
  deploy-production:
    name: 部署 production
    runs-on: ubuntu-latest
    needs: gate
    if: needs.gate.outputs.target == 'production' && needs.gate.outputs.production == 'true'
    timeout-minutes: 30
    # environment 配置了 Required reviewers 时会在此暂停等待审批
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: 配置 SSH
        run: .github/scripts/setup-ssh.sh
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}

      - name: 部署前备份数据库
        run: .github/scripts/backup-before-deploy.sh
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_PATH }}

      - name: 部署
        run: .github/scripts/deploy.sh
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_PATH }}
          ENVIRONMENT: production

      - name: 健康检查
        run: .github/scripts/healthcheck.sh "${{ vars.PRODUCTION_URL }}"

      - name: 失败时回滚
        if: failure()
        run: .github/scripts/rollback.sh
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_PATH: ${{ secrets.PRODUCTION_PATH }}
          ENVIRONMENT: production

  # ============================================================
  # 通知（仅在失败时触发）
  # ============================================================
  notify:
    name: 失败通知
    runs-on: ubuntu-latest
    needs: [gate, deploy-staging, deploy-production]
    if: failure()
    steps:
      - name: 发送通知
        run: .github/scripts/notify.sh
        env:
          WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ toJSON(needs) }}

name: CI

# 触发条件
#   本仓库本地默认分支为 master，而推送到 GitHub 目标仓库
#   （github.com/lza6/mailcow-dockerized-Max）使用的分支为 main，
#   因此两者都必须覆盖，否则总有一条工作分支拿不到质量门禁。
on:
  push:
    branches: [master, main, develop, "feature/**", "hotfix/**"]
  pull_request:
    branches: [master, main, develop]
  workflow_dispatch:

# 最小权限原则：默认只读，需要写权限的 job 单独声明
permissions:
  contents: read

# 同一分支的重复推送取消上一次运行，节省额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 项目为 PHP + 原生 JS + Twig，无 composer.json / package.json
  # 依赖已 vendor 到 data/web/inc/lib/vendor
  PHP_VERSION: "8.2"
  # Node 仅用于语言包校验脚本（仓库自带 node 校验逻辑）
  NODE_VERSION: "20"
  # Python 仅用于 cf-bridge 单元测试（纯标准库，无第三方依赖）
  PYTHON_VERSION: "3.12"

jobs:
  # ============================================================
  # Stage 1: 静态质量检查
  # 项目无 lint 配置，此处做「可落地的等价检查」：
  #   - PHP 语法（php -l 全量）
  #   - Twig 编译期检查（语法层面）
  #   - JS 语法（node --check）
  #   - 语言包完整性 + 占位符一致性（本项目核心资产）
  # ============================================================
  quality:
    name: 质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, json
          coverage: none

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: PHP 语法检查（全量，排除 vendor）
        run: |
          set -euo pipefail
          fail=0
          count=0
          while IFS= read -r f; do
            count=$((count + 1))
            if ! out=$(php -l "$f" 2>&1); then
              echo "::error file=$f::$out"
              fail=$((fail + 1))
            fi
          done < <(find data/web -name '*.php' -not -path '*/vendor/*' -not -path '*/lib/*')
          echo "检查 $count 个 PHP 文件，失败 $fail 个"
          [ "$fail" -eq 0 ]

      - name: JS 语法检查
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f" >/dev/null 2>&1; then
              echo "::error file=$f::JS 语法错误"
              fail=$((fail + 1))
            fi
          done < <(find data/web/js -name '*.js' -not -path '*/build/*')
          [ "$fail" -eq 0 ]

      - name: 语言包完整性校验（本项目核心资产）
        run: node .github/scripts/check-lang.cjs

      - name: 占位符一致性校验
        run: node .github/scripts/check-placeholders.cjs

  # ============================================================
  # Stage 2: 单元/集成测试
  # 本项目无既有测试框架，此 job 运行「可验证真实行为」的检查：
  #   - PHP 关键函数的行为测试（自建轻量断言，不引入新依赖）
  #   - 域名健康纯函数的判定测试（RBL 分类 / SPF 语义 / 分档，见 inc/domain_health_lib.inc.php）
  #   - 语言包结构与回退逻辑验证
  #   - cf-bridge 单元测试（标准库 unittest，无第三方依赖）
  # ============================================================
  test:
    name: 测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: 安装 PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, json, pdo, pdo_mysql
          coverage: none

      - name: 运行 PHP 断言测试
        run: php .github/scripts/test-runner.php

      - name: 域名健康纯函数测试
        run: php .github/scripts/test-domain-health.php

      - name: 域名健康弹窗渲染测试（真实 Twig × 3 语言）
        run: php .github/scripts/test-render-domain-health.php

      - name: 并发 DNS 报文解析测试（离线，合成报文）
        run: php .github/scripts/test-dns-parse.php

      - name: 养号 IMAP 文件夹名解码测试（离线）
        run: php .github/scripts/test-warmup-folder.php

      - name: Google Postmaster 纯逻辑测试（离线：DNS 记录拆分 / 阈值 / 汇总）
        run: php .github/scripts/test-postmaster.php

      # 凭据保管箱：密文落库、随机 IV、GCM 篡改检测、密钥 0600。
      # 这几条是"敏感凭据可逆保存"与"登录密码单向哈希"两类设计的分界线，
      # 退化了不会报错、只会静默泄露，所以必须有独立测试钉住。
      - name: 凭据保管箱加解密与安全属性测试（离线）
        run: php .github/scripts/test-secretbox.php

      - name: Google Postmaster 标签页渲染 + 模板↔JS 契约测试
        run: php .github/scripts/test-render-postmaster.php

      # 域名总览的「待体检队列」与 RDAP 三态。
      # 重点守的是「首屏绝不发起网络 I/O」——源码级断言队列函数体内
      # 不含 curl_/dns_get_record；以及"失败不能被当成未注册"这个曾经
      # 把「未知」固化 24 小时的坑。
      - name: 域名总览队列与 RDAP 三态测试（离线，假 redis 桩）
        run: php .github/scripts/test-overview-pending.php

      # 这一层是前两层的空档：PHP 测试只证明"数算对了"，
      # 渲染契约测试只证明"id 对上了"，都没证明"界面上显示成对的字"。
      # 用真实 jsdom + jQuery 把页面跑起来、喂数据、读回 DOM 文本。
      - name: 安装前端测试依赖（jsdom / jquery）
        run: npm ci --prefix .github/scripts/js-harness || npm install --prefix .github/scripts/js-harness

      - name: Google Postmaster 后台脚本 DOM 行为测试（jsdom 真实渲染）
        run: node .github/scripts/test-js-postmaster.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/.github/scripts/js-harness/node_modules

      # 含一条关键断言：pending 轮询次数必须**恰为上限**。
      # 曾经因为 apply() 每轮都重置预算导致无限轮询 —— 这条能抓住。
      - name: 域名总览 DOM 行为测试（jsdom 真实渲染 + 轮询上限断言）
        run: node .github/scripts/test-js-overview.mjs
        env:
          NODE_PATH: ${{ github.workspace }}/.github/scripts/js-harness/node_modules

      - name: 语言包回退逻辑测试
        run: php .github/scripts/test-lang-fallback.php

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: cf-bridge 单元测试
        run: python3 helper-scripts/cf-email-bridge/test_bridge.py
